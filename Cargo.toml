[package]
name = "adsbitalia-mlat-server"
version = "3.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
nalgebra = "0.33"
parking_lot = "0.12"
dashmap = "6.1"
futures = "0.3"
flate2 = "1.0"
mimalloc = { version = "0.1", default-features = false }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = false
debug = 1
